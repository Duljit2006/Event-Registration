<script>
    (function() {
      const closeBtn = document.getElementById('modal-close');
      const goBackBtn = document.getElementById('btn-go-back');
      const modalCard = document.getElementById('modal-card');
      const modalBackdrop = document.getElementById('modal-backdrop');

      function dismissModal() {
        modalCard.classList.remove('scale-100', 'opacity-100');
        modalCard.classList.add('scale-95', 'opacity-0');
        modalBackdrop.classList.add('opacity-0');
        
        setTimeout(() => {
          modalCard.classList.add('hidden');
          modalBackdrop.classList.add('hidden');
        }, 250);
      }

      if (closeBtn) closeBtn.addEventListener('click', dismissModal);
      if (goBackBtn) goBackBtn.addEventListener('click', dismissModal);
      if (modalBackdrop) modalBackdrop.addEventListener('click', dismissModal);
    })();
  </script>
